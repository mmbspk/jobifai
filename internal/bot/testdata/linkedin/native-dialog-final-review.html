<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<!-- Sanitized fixture: native-dialog final review step.
     Used to verify jsLinkedInAtFinalReview correctly identifies the submit page
     in the new native-dialog layout.
     Confirmed structure from Sep 20 2026 capture (page 3/4 with "Review" button
     navigates to this step). -->

<dialog data-testid="dialog" aria-labelledby="dialog-header" open="">
  <button type="button" aria-label="Dismiss">✕</button>

  <div>
    <header id="dialog-header">
      <h2>Apply to Test Company</h2>
    </header>

    <div data-testid="dialog-content">
      <div data-sdui-screen="com.linkedin.sdui.flagshipnav.jobs.easyapply.EasyApply">

        <p>4/4 pages</p>

        <div data-testid="lazy-column" data-component-type="LazyColumn">
          <!-- Final review heading (detected by jsLinkedInAtFinalReview) -->
          <h2>Review your application</h2>

          <!-- Summary of submitted info (read-only) -->
          <section>
            <p>Test User</p>
            <p>test@example.com</p>
          </section>
        </div>

      </div>
    </div>

    <footer>
      <button type="button">
        <span><span>Back</span></span>
      </button>
      <!-- Submit button — no data-easy-apply-submit-button in new SDUI layout.
           Detected by text content "Submit application" or similar. -->
      <button type="button">
        <span><span>Submit application</span></span>
      </button>
    </footer>
  </div>
</dialog>

</body>
</html>
