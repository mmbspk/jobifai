<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<!-- Sanitized fixture: native-dialog resume upload step.
     This is the step where jsScanFields returns ResumeFileSlots=0 in production.
     Structure inferred from Oct 22 2026 capture + SDUI patterns.
     The "Upload resume" button and the upload mechanism need live-DOM verification
     for exact aria-label text and whether clicking fires PageFileChooserOpened. -->

<dialog data-testid="dialog" aria-labelledby="dialog-header" open="">
  <button type="button" aria-label="Dismiss">✕</button>

  <div>
    <header id="dialog-header">
      <h2>Apply to Test Company</h2>
    </header>

    <div data-testid="dialog-content">
      <div data-sdui-screen="com.linkedin.sdui.flagshipnav.jobs.easyapply.EasyApply">

        <p>2/4 pages</p>

        <div data-testid="lazy-column" data-component-type="LazyColumn">
          <p>Resume</p>

          <!-- Resume section: button only — NO <input type="file"> in the DOM.
               The file input is created dynamically when the button is clicked
               (or the button triggers a CDP file chooser directly). This is why
               jsScanFields returns ResumeFileSlots=0 in production — the file
               input scan finds nothing, and the button is not yet detected.
               aria-required on the section marks this field as required.
               [UNCONFIRMED]: exact aria-label text; verify against live DOM. -->
          <div id="resume-section" aria-required="true">
            <label>Resume (required)</label>
            <button type="button" id="upload-resume-btn">
              <span><span>Upload resume</span></span>
            </button>
          </div>

        </div>

      </div>
    </div>

    <footer>
      <button type="button">
        <span><span>Back</span></span>
      </button>
      <button type="button">
        <span><span>Next</span></span>
      </button>
    </footer>
  </div>
</dialog>

</body>
</html>
