<!DOCTYPE html>
<html>
<head><meta charset="utf-8"></head>
<body>
<!-- Sanitised fixture: native-dialog resume upload step.
     Structure from Oct 22 2026 capture. The dialog uses <dialog open> without
     role="dialog" (LinkedIn SDUI). The resume section has:
       - an asterisk label (required signal from label text, not aria-required)
       - an existing library entry as an unchecked radio choice
       - an "Upload resume" button for uploading a new file
     No <input type="file"> is present in the DOM; it appears only after clicking
     the Upload button or via CDP file-chooser interception. -->

<dialog data-testid="dialog" aria-labelledby="dialog-header" open="">
  <button type="button" aria-label="Dismiss">✕</button>

  <div>
    <header id="dialog-header">
      <h2>Apply to Test Company</h2>
    </header>

    <div data-testid="dialog-content">
      <div data-sdui-screen="com.linkedin.sdui.flagshipnav.jobs.easyapply.EasyApply">

        <p>2/4 pages</p>

        <div data-testid="lazy-column" data-component-type="LazyColumn">

          <!-- Resume section: NO <input type="file"> in DOM.
               Required is signalled by the asterisk in the label text.
               The library entry is an unchecked radio (no resume selected yet). -->
          <div id="resume-section">
            <label>Resume <span aria-hidden="true">*</span></label>

            <div>
              <input type="radio" name="resume-select" id="r-lib1" value="lib1">
              <label for="r-lib1">my_resume_2026.pdf</label>
            </div>

            <button type="button" id="upload-resume-btn">
              <span><span>Upload resume</span></span>
            </button>
          </div>

        </div>

      </div>
    </div>

    <footer>
      <button type="button">
        <span><span>Back</span></span>
      </button>
      <button type="button">
        <span><span>Next</span></span>
      </button>
    </footer>
  </div>
</dialog>

</body>
</html>
