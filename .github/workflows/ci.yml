name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Install Chromium for Go browser regressions
        run: cd web && npx playwright install --with-deps chromium

      - name: Configure Rod browser
        run: echo "ROD_BROWSER_BIN=$(cd web && node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: LinkedIn resolver DOM regressions
        run: cd web && node --test linkedin-resolver-check.cjs

      - name: LinkedIn historical recovery tests
        run: python3 -m unittest discover -s scripts -p test_recover_linkedin_identity.py

      - name: Lint
        run: |
          go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
          make lint

      - name: Go + frontend tests with coverage
        run: make test-coverage
        env:
          CI: "1"

      - name: Upload Go coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        run: cd web && npm ci

      - name: Install Playwright browser
        run: cd web && npx playwright install --with-deps chromium

      - name: Expose Playwright Chromium as ROD_BROWSER_BIN
        run: echo "ROD_BROWSER_BIN=$(cd web && node -e "console.log(require('playwright').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Playwright e2e (includes seeded job fixtures)
        run: make test-e2e
        env:
          CI: "1"
