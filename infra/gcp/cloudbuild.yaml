# Optional manual submit (triggered builds supply these substitutions automatically):
# gcloud builds submit --config=infra/gcp/cloudbuild.yaml --substitutions=COMMIT_SHA=$(git rev-parse HEAD),SHORT_SHA=$(git rev-parse --short HEAD) .
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - BUILD_VERSION=$SHORT_SHA
      - --build-arg
      - BUILD_GIT_SHA=$COMMIT_SHA
      - --build-arg
      - BUILD_SOURCE_STATE=clean
      - -t
      - australia-southeast1-docker.pkg.dev/jobifai-494014/jobifai/jobifai:$SHORT_SHA
      - -t
      - australia-southeast1-docker.pkg.dev/jobifai-494014/jobifai/jobifai:latest
      - .
images:
  - australia-southeast1-docker.pkg.dev/jobifai-494014/jobifai/jobifai:$SHORT_SHA
  - australia-southeast1-docker.pkg.dev/jobifai-494014/jobifai/jobifai:latest
options:
  machineType: E2_HIGHCPU_8
